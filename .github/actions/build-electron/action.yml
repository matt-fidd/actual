name: Build desktop app
description: >-
  Builds the Actual desktop app (Electron) for the current runner OS with the
  given version stamped on it. Installers land in
  packages/desktop-electron/dist. Uploading them is left to the caller.

inputs:
  version:
    description: 'Exact version to stamp on the build. When empty it is computed from `version-type`'
    required: false
    default: ''
  version-type:
    description: >-
      get-next-package-version --type used to compute the version when
      `version` is empty (e.g. nightly)
    required: false
    default: ''
  csc-key-password:
    description: 'macOS signing certificate password'
    required: false
    default: ''
  csc-link:
    description: 'macOS signing certificate'
    required: false
    default: ''
  apple-id:
    description: 'Apple ID used for notarization'
    required: false
    default: ''
  apple-app-specific-password:
    description: 'App-specific password used for notarization'
    required: false
    default: ''
  apple-team-id:
    description: 'Apple team id used for notarization'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: runner.os == 'Windows'
      shell: bash
      run: pip.exe install setuptools

    - if: runner.os != 'Windows'
      shell: bash
      run: |
        mkdir .venv
        python3 -m venv .venv
        source .venv/bin/activate
        python3 -m pip install setuptools

    - name: Set up environment
      uses: ./.github/actions/setup
      with:
        # Avoid restoring potentially poisoned caches in release jobs.
        cache: 'false'

    - name: Resolve version
      id: version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_VERSION_TYPE: ${{ inputs.version-type }}
      run: |
        if [[ -n "$INPUT_VERSION" ]]; then
          version="$INPUT_VERSION"
        else
          version=$(yarn workspace @actual-app/ci-actions tsx bin/get-next-package-version.ts --package-json ./packages/desktop-electron/package.json --type "$INPUT_VERSION_TYPE")
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Flatpak dependencies
      if: runner.os == 'Linux'
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        sudo apt-get update
        sudo apt-get install flatpak -y
        sudo apt-get install flatpak-builder -y
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install org.freedesktop.Sdk//24.08 -y
        sudo flatpak install org.freedesktop.Platform//24.08 -y
        sudo flatpak install org.electronjs.Electron2.BaseApp//24.08 -y
        sudo flatpak install org.flatpak.Builder -y

        METAINFO_FILE="packages/desktop-electron/extra-resources/linux/com.actualbudget.actual.metainfo.xml"
        TODAY=$(date +%Y-%m-%d)
        sed -i "s/%RELEASE_VERSION%/$VERSION/g; s/%RELEASE_DATE%/$TODAY/g" "$METAINFO_FILE"
        flatpak run --command=flatpak-builder-lint org.flatpak.Builder appstream "$METAINFO_FILE"

    - name: Install arm64 cross-compilation toolchain
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # better-sqlite3 has no Electron prebuilds for this Electron version,
        # so the arm64 AppImage's native modules are cross-compiled from
        # source. beforePackHook points CC_target/CXX_target at this
        # toolchain during the arm64 pass.
        sudo apt-get update
        sudo apt-get install -y crossbuild-essential-arm64

    - name: Update package versions
      shell: bash
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: npm version "$VERSION" --no-git-tag-version --workspace=desktop-electron --no-workspaces-update

    - name: Build Electron for Mac
      if: runner.os == 'macOS'
      shell: bash
      env:
        CSC_KEY_PASSWORD: ${{ inputs.csc-key-password }}
        CSC_LINK: ${{ inputs.csc-link }}
        APPLE_ID: ${{ inputs.apple-id }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.apple-app-specific-password }}
        APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
      run: ./bin/package-electron --skip-translations

    - name: Build Electron
      if: runner.os != 'macOS'
      shell: bash
      run: ./bin/package-electron --skip-translations
